<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#1a5f4a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Umrah Connect">
    <link rel="apple-touch-icon" href="/static/images/icon-192.png">
    <title>Reset password - Umrah Connect</title>
    <meta name="robots" content="noindex">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700&display=swap">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="stylesheet" href="/static/css/style.css?v=16">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="/static/js/i18n.js?v=10"></script>
</head>
<body>
    <a href="#main" class="skip-link" data-i18n="nav_home">Skip to content</a>
    <nav class="navbar">
        <a href="/" class="logo">
            <span class="logo-icon" aria-hidden="true">🕋</span>
            <span data-i18n="app_name">Umrah Connect</span>
        </a>
        <button class="hamburger" aria-label="Menu">
            <span></span><span></span><span></span>
        </button>
        <div class="nav-links"></div>
    </nav>

    <main id="main" class="container" style="max-width:480px; margin: 3rem auto;">
        <div class="auth-card">
            <h2 data-i18n="reset_password_title">Reset your password</h2>

            <!-- Step 1: request a token -->
            <div id="requestBlock">
                <p style="color:var(--text-secondary)" data-i18n="reset_password_email_label">
                    Enter your email and we will email you a reset link
                </p>
                <form id="requestForm">
                    <div class="form-group">
                        <label for="email" data-i18n="form_email">Email</label>
                        <input id="email" type="email" inputmode="email" autocomplete="email" required maxlength="120">
                    </div>
                    <button class="btn btn-primary" type="submit" style="width:100%">
                        <span data-i18n="reset_password_button">Reset password</span>
                    </button>
                </form>
                <p id="devLink" style="margin-top:1rem; word-break:break-all; font-size:0.85rem;"></p>
            </div>

            <!-- Step 2: token + new password (URL pre-fills token) -->
            <div id="confirmBlock" style="display:none">
                <form id="confirmForm">
                    <div class="form-group">
                        <label for="newPassword" data-i18n="reset_password_new">New password</label>
                        <div class="pw-field">
                            <input id="newPassword" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
                            <button type="button" class="pw-toggle" aria-label="Show password"><i class="fas fa-eye" aria-hidden="true"></i></button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword" data-i18n="reset_password_confirm">Confirm password</label>
                        <div class="pw-field">
                            <input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
                            <button type="button" class="pw-toggle" aria-label="Show password"><i class="fas fa-eye" aria-hidden="true"></i></button>
                        </div>
                    </div>
                    <button class="btn btn-primary" type="submit" style="width:100%">
                        <span data-i18n="reset_password_button">Reset password</span>
                    </button>
                </form>
            </div>
        </div>
    </main>

    <nav class="mobile-nav-bar" id="mobileNavBar"></nav>
    <script src="/static/js/app.js?v=20"></script>
    <script>
        const t = (k) => (window.I18N ? I18N.t(k) : k);

        // Show/hide password toggles
        document.querySelectorAll('.pw-toggle').forEach((btn) => {
            const input = btn.closest('.pw-field').querySelector('input');
            btn.setAttribute('aria-label', t('show_password'));
            btn.addEventListener('click', () => {
                const show = input.type === 'password';
                input.type = show ? 'text' : 'password';
                btn.querySelector('i').className = show ? 'fas fa-eye-slash' : 'fas fa-eye';
                btn.setAttribute('aria-label', t(show ? 'hide_password' : 'show_password'));
            });
        });

        // Auto-open confirm view if token is in URL
        const params = new URLSearchParams(window.location.search);
        const tokenInUrl = params.get('token');
        if (tokenInUrl) {
            document.getElementById('requestBlock').style.display = 'none';
            document.getElementById('confirmBlock').style.display = 'block';
        }

        document.getElementById('requestForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            btn.disabled = true;
            const email = document.getElementById('email').value.trim();
            try {
                const r = await API.post('/api/password-reset/request', { email });
                UI.showAlert(r.message || 'Check your email');
                if (r.dev_reset_link) {
                    document.getElementById('devLink').innerHTML =
                        'Dev mode: <a href="' + r.dev_reset_link + '">' + r.dev_reset_link + '</a>';
                }
            } catch (err) {
                UI.showAlert(err.message || t('error_generic'), 'error');
            } finally {
                btn.disabled = false;
            }
        });

        document.getElementById('confirmForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const pw = document.getElementById('newPassword').value;
            const c  = document.getElementById('confirmPassword').value;
            if (pw !== c) {
                UI.showAlert(t('passwords_no_match'), 'error');
                return;
            }
            const btn = e.target.querySelector('button[type="submit"]');
            btn.disabled = true;
            try {
                await API.post('/api/password-reset/confirm', { token: tokenInUrl, new_password: pw });
                UI.showAlert(t('password_reset_success'));
                setTimeout(() => window.location.href = '/login', 1500);
            } catch (err) {
                UI.showAlert(err.message || t('error_generic'), 'error');
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
